:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e9eee9;background:#101a17}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#1b3029,#101a17 48%)}main{max-width:620px;margin:auto;padding:22px 17px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{color:#a6b6aa;font-size:11px;letter-spacing:2px;font-weight:700}h1{font-size:29px;margin:5px 0 0;letter-spacing:-.8px}h2{font-size:19px;margin:0 0 13px}h3{margin:0 0 8px;font-size:17px}.sub{color:#9baea1;font-size:13px}.card{background:#22342d;border:1px solid #385044;border-radius:19px;padding:17px;margin-bottom:15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat strong{display:block;font-size:32px;margin:3px 0}.gold{color:#e5be78}.muted{color:#a6b7ab}.wine{display:flex;gap:14px;align-items:center}.bottle{background:#34473d;border-radius:13px;display:grid;place-items:center;font-size:43px;width:73px;height:100px;flex-shrink:0}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#365944;color:#ccead4;font-size:11px;font-weight:700}.tabs{position:fixed;bottom:0;left:0;right:0;background:#192821;border-top:1px solid #385044;display:flex;justify-content:center;padding:9px 5px max(12px,env(safe-area-inset-bottom));z-index:3}.tab{border:0;background:none;color:#aab8ad;font-size:11px;flex:1;max-width:115px;padding:7px 1px}.tab b{display:block;font-size:21px;margin-bottom:3px}.tab.active{color:#e7c181}button{cursor:pointer}button.primary{background:#d8b573;color:#19251e;border:0;border-radius:12px;padding:13px 15px;font-weight:800;font-size:14px}button.secondary{background:#344a3d;color:#e6eee7;border:1px solid #536d59;border-radius:12px;padding:11px 13px;font-weight:650}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.section{margin:24px 0 11px;display:flex;justify-content:space-between;align-items:center}label{display:block;font-size:12px;color:#b7c8bb;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #4b6253;background:#14231d;color:#f0f4ef;border-radius:11px;padding:12px;font:inherit;font-size:15px}textarea{min-height:80px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.divider{border-top:1px solid #3a4d40;margin:14px 0}.item{padding:13px 0;border-bottom:1px solid #3a4d40}.item:last-child{border:0}.stars{color:#e5be78;letter-spacing:2px}.empty{padding:25px 15px;text-align:center;color:#aebfb2}.small{font-size:12px}.notice{background:#283d31;border-left:3px solid #e5be78;padding:12px;border-radius:8px;font-size:12px;color:#c5d5c9;margin:12px 0}.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.slot{aspect-ratio:1;background:#34483e;border:2px solid #536d59;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#dbe6dd;font-weight:700}.slot.filled{background:#684438;border-color:#b88a62}.slot small{font-size:10px;color:#d7c5b1}.progress{height:8px;background:#3a4a40;border-radius:10px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#d9b574}.badge{font-size:12px;background:#3b5143;border-radius:20px;padding:5px 10px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#e1c188;color:#19251e;padding:12px 18px;border-radius:12px;z-index:5;display:none;max-width:90%;text-align:center}.linkbtn{border:0;background:none;color:#e8c88d;padding:4px;font-weight:700}
 .dialogShade{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:10;padding:18px}.dialogBox{background:#22342d;border:1px solid #66806d;border-radius:18px;padding:20px;width:min(100%,430px);max-height:85vh;overflow:auto}.dialogBox h2{margin-bottom:12px}.dialogBox .actions{justify-content:flex-end}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><div id="toast" class="toast"></div><div id="slotDialog" class="dialogShade hidden" role="dialog" aria-modal="true"><div class="dialogBox"><h2 id="slotHeading">Velg vin</h2><p class="sub" id="slotInfo"></p><label for="slotSelect">Vin til røret</label><select id="slotSelect"></select><div class="actions"><button class="secondary" onclick="closeSlotDialog()">Avbryt</button><button class="primary" onclick="saveSlotDialog()">Lagre plassering</button><button class="primary hidden" id="openSlotButton" onclick="openFromSlot()">🍷 Åpne flaske</button></div></div></div><main><header><div><div class="eyebrow">DIN PERSONLIGE VINSAMLING · V4.1</div><h1>Min vinkjeller <span class="gold">🍷</span></h1><div class="sub">Hytta · Et godt glass om gangen</div></div><span style="font-size:30px">🏡</span></header><section id="home"></section><section id="shelf" class="hidden"></section><section id="taste" class="hidden"></section><section id="likes" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs" id="tabs"></nav><script>
const KEY='min-vinkjeller-hytta-v1';const initial={wines:[{id:'ardanza2020',name:'Viña Ardanza Reserva',producer:'La Rioja Alta',year:'2020',region:'Rioja, Spania',qty:5,target:5,bought:'2026-10-22',price:'',notes:'',food:'Lam, storfe, sopp, modne oster',window:'Kan lagres videre; vurder utviklingen over tid.'}],likes:[],tastings:[],climate:[],slots:[],wishlist:['Matsu El Viejo 2023','Rivetto Barolo Serralunga 2016','Marchesi di Barolo Ruvei Barbera d’Alba 2023','Protos Roble 2024','Biscardo Neropasso 2023'],shelfCapacity:30};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)};let current='home';let editingSlot=null;const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(KEY,JSON.stringify(db));render();queueCloudSave()}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function btn(text,fn,kind='secondary'){return `<button class="${kind}" onclick="${fn}">${text}</button>`}function navigate(page){current=page;render();window.scrollTo(0,0)}function render(){let names=[['home','⌂','Hjem'],['shelf','▦','Vinhylle'],['taste','★','Smaking'],['likes','♡','Liker-listen'],['settings','⚙','Mer']];$('tabs').innerHTML=names.map(([id,ico,name])=>`<button class="tab ${current===id?'active':''}" onclick="navigate('${id}')"><b>${ico}</b>${name}</button>`).join('');names.forEach(([id])=>$(id).classList.toggle('hidden',id!==current));const count=db.wines.reduce((a,w)=>a+Number(w.qty||0),0);const full=db.wines.filter(w=>w.qty>=w.target&&w.target>0).length;$('home').innerHTML=`<div class="stats"><div class="card stat"><span class="sub">Flasker på lager</span><strong>${count}</strong><span class="small gold">Mål: 30 + magnum</span></div><div class="card stat"><span class="sub">Komplette vintyper</span><strong>${full}<span class="muted">/6</span></strong><span class="small muted">Faste favoritter</span></div></div><div class="card"><div class="row"><h3>Samlingen vokser</h3><span class="badge">${Math.round(Math.min(100,count/30*100))}%</span></div><div class="progress"><div style="width:${Math.min(100,count/30*100)}%"></div></div><span class="sub">${count} av 30 planlagte standardflasker</span></div><div class="section"><h2>På lager nå</h2><button class="linkbtn" onclick="navigate('shelf')">Se alle →</button></div>${db.wines.filter(w=>w.qty>0).map(w=>`<div class="card wine"><div class="bottle">🍷</div><div><h3>${safe(w.name)}</h3><div class="sub">${safe(w.producer)} · ${safe(w.year)}</div><p><span class="pill">${w.qty} flasker</span></p><div class="sub">${safe(w.region)}</div></div></div>`).join('')||'<div class="empty">Ingen flasker registrert ennå.</div>'}<div class="section"><h2>Hva vil du gjøre?</h2></div><div class="actions">${btn('🍷 Åpne en flaske',"navigate('shelf')",'primary')}${btn('♡ Registrer en favoritt',"navigate('likes')")}${btn('＋ Legg til vin',"navigate('shelf')")}</div><div class="notice">Data lagres lokalt. Aktiver sikker skylagring under «Mer» for synkronisering mellom enhetene.</div>`;
let positions=Array.from({length:Math.max(30,db.shelfCapacity||30)},(_,i)=>db.slots[i]||'');$('shelf').innerHTML=`<h2>Vinhylla</h2><p class="sub">Ett rør = én flaske. Velg et rør for å plassere eller fjerne én flaske. Beholdningen endres ikke ved plassering.</p><div class="card"><div class="shelf">${positions.map((id,i)=>`<button class="slot ${id?'filled':''}" onclick="assignSlot(${i})">${i+1}<small>${id?'🍷':''}</small></button>`).join('')}</div></div><p class="small muted">Plassert i rør: ${db.slots.filter(Boolean).length} av ${db.wines.reduce((a,w)=>a+Number(w.qty||0),0)} flasker. Flytting: tøm gammelt rør og velg nytt. ${db.slots.filter(Boolean).length<db.wines.reduce((a,w)=>a+Number(w.qty||0),0)?'<strong style="color:#e5be78"> Noen flasker mangler rørplassering. Beholdningen er ikke endret. Trykk på tomme rør for å plassere flasker uten å øke antallet.</strong>':''}</p><div class="section"><h2>Vinregister</h2>${btn('＋ Ny vin','addWine()','primary')}</div>${db.wines.map(w=>`<div class="card"><div class="row"><div><h3>${safe(w.name)} ${safe(w.year)}</h3><div class="sub">${safe(w.producer)} · ${safe(w.region)}</div></div><span class="pill">${w.qty}/${w.target}</span></div><p class="small muted">Mat: ${safe(w.food||'Ikke registrert')}</p><p class="small muted">Anbefalt drikkeperiode: ${w.drinkFrom&&w.drinkTo?safe(w.drinkFrom)+'–'+safe(w.drinkTo):w.drinkFrom?'Fra '+safe(w.drinkFrom):w.drinkTo?'Til '+safe(w.drinkTo):'Ikke registrert'}</p><p class="small muted">${safe(w.window||'')}</p><div class="actions"><a class="secondary" style="text-decoration:none;display:inline-flex;align-items:center;color:#e5be78;border-color:#e5be78" target="_blank" rel="noopener noreferrer" href="https://www.vinmonopolet.no/search?q=${encodeURIComponent([w.name,w.year].filter(Boolean).join(' '))}">Søk hos Vinmonopolet ↗</a>${btn('＋ Kjøpt',`changeQty('${w.id}',1)`)}${btn('− Uttak',`openBottle('${w.id}')`)}${btn('Rediger',`editWine('${w.id}')`)}</div></div>`).join('')}`;
$('taste').innerHTML=`<h2>Smaksdagbok</h2><p class="sub">Registrer opplevelser og matfølge. Uttak fra lager føres når du åpner en flaske via «Vinhylle».</p><div class="card"><h3>Ny smaksregistrering</h3><label>Vin</label><select id="tasteWine"><option value="">Velg vin eller skriv navn nedenfor</option>${db.wines.map(w=>`<option value="${safe(w.id)}">${safe(w.name)} ${safe(w.year)}</option>`).join('')}</select><label>Annen vin (valgfritt)</label><input id="tasteOther" placeholder="Navn og årgang"><div class="two"><div><label>Karakter 1–5</label><select id="tasteRating">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)} (${n})</option>`).join('')}</select></div><div><label>Dato</label><input type="date" id="tasteDate" value="${today()}"></div></div><label>Matrett</label><input id="tasteFood" placeholder="Hva spiste du til?"><label>Hvor godt passet maten?</label><select id="tastePair"><option value="">Ikke vurdert</option><option>Perfekt</option><option>Bra</option><option>Middels</option><option>Passet ikke</option></select><label>Smaksnotater / feedback</label><textarea id="tasteNotes" placeholder="Duft, smak, syre, tanniner, helhetsinntrykk ..."></textarea><div class="actions">${btn('Lagre smaking','addTasting()','primary')}</div></div><div class="section"><h2>Tidligere smakinger</h2></div>${db.tastings.length?db.tastings.slice().reverse().map(t=>`<div class="card"><div class="row"><strong>${safe(t.name)}</strong><span class="stars">${'★'.repeat(Number(t.rating))}</span></div><div class="sub">${safe(t.date)} · ${safe(t.food||'Uten registrert mat')}</div><p>${safe(t.notes)}</p><span class="sub">Matmatch: ${safe(t.pair||'Ikke vurdert')}</span></div>`).join(''):'<div class="empty">Her kommer smaksopplevelsene dine.</div>'}`;
$('likes').innerHTML=`<h2>♡ Liker-listen</h2><p class="sub">Viner smakt hos venner, på restaurant eller andre steder. Påvirker ikke lagerbeholdningen.</p><div class="card"><h3>Legg til en vin du liker</h3><label>Vin / produsent</label><input id="likeName" placeholder="F.eks. Barolo Serralunga"><div class="two"><div><label>Årgang</label><input id="likeYear" placeholder="2021"></div><div><label>Karakter</label><select id="likeRating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} av 5</option>`).join('')}</select></div></div><label>Hvor smakte du den?</label><input id="likePlace" placeholder="Restaurant, venner, hjemme ..."><label>Mat og smaksnotater</label><textarea id="likeNotes" placeholder="Hva likte du? Hvilken mat passet?"></textarea><label>Kjøpe igjen?</label><select id="likeBuy"><option>Ja</option><option>Kanskje</option><option>Nei</option></select><label>Kandidat til fast plass i hylla?</label><select id="likeCandidate"><option value="yes">Ja</option><option value="no">Ikke nå</option></select><div class="actions">${btn('Lagre i Liker-listen','addLike()','primary')}</div></div><div class="section"><h2>Favoritter og utfordrere</h2></div>${db.likes.length?db.likes.slice().reverse().map(l=>`<div class="card"><div class="row"><h3>${safe(l.name)} ${safe(l.year)}</h3><span class="stars">${'★'.repeat(Number(l.rating))}</span></div><div class="sub">${safe(l.place||'Sted ikke oppgitt')}</div><p>${safe(l.notes||'')}</p><span class="pill">${l.candidate==='yes'?'Utfordrer til vinhylla':'Liker-listen'}</span><span class="sub"> · Kjøpe igjen: ${safe(l.buy)}</span><div class="actions">${btn('Legg til i vinregister',`promoteLike('${l.id}')`)}</div></div>`).join(''):'<div class="empty">Her bygger vi listen over fremtidige utfordrere til de seks faste vinene.</div>'}`;
$('settings').innerHTML=`<h2>Mer og sikkerhetskopi</h2><div class="card"><h3>Innkjøpsplan</h3><p class="sub">Omtrent én flaske per måned · maks 700 kr per flaske som utgangspunkt.</p>${db.wishlist.map((w,i)=>`<div class="item row"><span>${safe(w)}</span><button class="linkbtn" onclick="removeWish(${i})">Fjern</button></div>`).join('')}<label>Legg til ønsket vin</label><input id="wishName" placeholder="Vin og årgang"><div class="actions">${btn('Legg til','addWish()')}</div></div><div class="card"><h3>Temperatur og luftfuktighet</h3><p class="sub">Manuell logg nå. Shelly-integrasjon vurderes i senere versjon.</p><div class="two"><div><label>Temperatur °C</label><input type="number" step="0.1" id="temp" placeholder="15.3"></div><div><label>Fuktighet %</label><input type="number" step="0.1" id="humid" placeholder="56"></div></div><div class="actions">${btn('Lagre måling','addClimate()')}</div>${db.climate.slice(-5).reverse().map(c=>`<div class="item small">${safe(c.date)} · ${safe(c.temp)} °C · ${safe(c.humid)} %</div>`).join('')}</div><div class="card"><h3>☁ Skylagring og synkronisering</h3><p class="sub" id="cloudStatus">Ikke tilkoblet.</p><label>E-post for vinkjelleren</label><input id="cloudEmail" type="email" autocomplete="username" placeholder="E-post"><label>Passord for vinkjelleren</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="Passord"><div class="actions"><button class="primary" onclick="cloudLogin()">Logg inn</button><button class="secondary" onclick="cloudLogout()">Logg ut</button></div><div id="cloudActions" class="hidden"><div class="notice">Første gang: Ta en JSON-sikkerhetskopi først. Velg deretter én av handlingene under. Ingen data erstattes uten bekreftelse.</div><div class="actions"><button class="primary" onclick="cloudUploadFirst()">↑ Overfør denne enhetens data til skyen</button><button class="secondary" onclick="cloudDownloadFirst()">↓ Hent data fra skyen til denne enheten</button></div></div></div><div class="card"><h3>Sikkerhetskopi</h3><p class="sub">Eksporter en JSON-fil til Filer/iCloud Drive. Importer den ved behov for å gjenopprette alle registreringer.</p><div class="actions">${btn('↓ Eksporter data','exportData()','primary')}${btn('↑ Importer data',"$('importFile').click()")}</div><input class="hidden" id="importFile" type="file" accept=".json,application/json" onchange="importData(this)"></div><div class="card"><h3>Nullstill testdata</h3><p class="sub">Sletter alle lokale registreringer, feilregistrerte viner, rørplasseringer og smaksnotater. Starter på nytt med 5 flasker Viña Ardanza Reserva 2020 kjøpt 22.10.2026 og 30 tomme rør.</p><div class="actions">${btn('Nullstill og start på nytt','resetTestData()')}</div></div><div class="notice">Versjon 4.1. Skylagring aktiveres først når du logger inn og velger hvordan data skal overføres. Shelly-tilkobling er ikke aktivert.</div>`;
 if(cloudUser)cloudState(cloudEnabled?'Synkronisering aktiv – '+cloudUser.email:'Innlogget: '+cloudUser.email+'. Velg overføring.');
}
function resetTestData(){if(cloudEnabled)return toast('Koble fra skylagring før nullstilling');if(!confirm('Vil du slette ALLE lokale registreringer og starte med 5 flasker Viña Ardanza og tomme rør?'))return;if(!confirm('Bekreft nullstilling: dette kan ikke angres uten en sikkerhetskopi.'))return;db=structuredClone(initial);localStorage.setItem(KEY,JSON.stringify(db));navigate('home');toast('Nullstilt: 5 flasker, 30 tomme rør')}
function ask(message,defaultValue=''){let r=prompt(message,defaultValue);return r===null?null:r.trim()}function changeQty(id,delta){let w=db.wines.find(x=>x.id===id);if(!w)return;if(delta<0&&w.qty<1)return toast('Ingen flasker igjen');w.qty=Math.max(0,Number(w.qty)+delta);save();toast('Beholdning oppdatert')}function openBottle(id){
 let w=db.wines.find(x=>x.id===id);
 if(!w||w.qty<1)return toast('Ingen flasker på lager');
 const occupied=db.slots.map((x,i)=>x===id?i:-1).filter(i=>i>=0);
 let slot=-1;
 if(occupied.length){
   const answer=ask('Hvilket rør tar du flasken fra?\n'+occupied.map(i=>i+1).join(', '),String(occupied[0]+1));
   if(answer===null)return;
   slot=Number(answer)-1;
   if(!occupied.includes(slot))return toast('Velg et rør med denne vinen');
 }
 if(!confirm('Åpne én flaske '+w.name+' '+w.year+'? Lagerbeholdningen reduseres med én'+(slot>=0?' og rør '+(slot+1)+' tømmes':'')+'.'))return;
 w.qty=Number(w.qty)-1;
 if(slot>=0)db.slots[slot]='';
 save();toast('Flaske åpnet og lager oppdatert');navigate('taste');$('tasteWine').value=id;
}
function addWine(){let name=ask('Vinens navn');if(!name)return;let year=ask('Årgang','2023');if(year===null)return;let qty=Number(ask('Antall flasker', '1'));if(!Number.isInteger(qty)||qty<0)return toast('Ugyldig antall');db.wines.push({id:'w'+Date.now(),name,year,qty,producer:'',region:'',target:5,bought:today(),price:'',food:'',window:'',drinkFrom:'',drinkTo:'',notes:''});save()}function editWine(id){let w=db.wines.find(x=>x.id===id);if(!w)return;for(let [field,label] of [['name','Navn'],['producer','Produsent'],['year','Årgang'],['region','Region'],['bought','Kjøpsdato ÅÅÅÅ-MM-DD'],['price','Pris per flaske (kr)'],['food','Matanbefaling'],['drinkFrom','Anbefalt drikkefra (år, f.eks. 2028)'],['drinkTo','Anbefalt drikke til (år, f.eks. 2035)'],['window','Lagringsnotat / kilde til anbefaling'],['notes','Notater']]){let v=ask(label,w[field]||'');if(v===null){save();return}w[field]=v}let target=ask('Mål antall flasker',String(w.target));if(target!==null&&Number.isInteger(Number(target))&&Number(target)>=0)w.target=Number(target);save()}function assignSlot(i){
 editingSlot=i;
 const currentId=db.slots[i]||'';
 $('slotHeading').textContent='Rør '+(i+1);
 $('slotInfo').textContent='Ett rør = én flaske. Velg vinsort eller tøm røret. Lagerantallet endres ikke.';
 const choices=['<option value="">— Tomt rør —</option>'];
 db.wines.forEach(w=>{
   const placed=db.slots.filter((id,j)=>j!==i&&id===w.id).length;
   if(placed<Number(w.qty)||w.id===currentId){
     choices.push(`<option value="${safe(w.id)}">${safe(w.name)} ${safe(w.year)} (${Math.max(0,Number(w.qty)-placed)} tilgjengelig)</option>`);
   }
 });
 $('slotSelect').innerHTML=choices.join('');
 $('slotSelect').value=currentId;
 $('openSlotButton').classList.toggle('hidden',!currentId);
 $('slotDialog').classList.remove('hidden');
}
function openFromSlot(){if(editingSlot===null)return;const i=editingSlot,id=db.slots[i];const w=db.wines.find(w=>w.id===id);if(!w||Number(w.qty)<1)return toast('Ingen flaske på lager');if(!confirm('Åpne '+w.name+' '+w.year+' fra rør '+(i+1)+'? Beholdningen reduseres med én.'))return;w.qty=Number(w.qty)-1;db.slots[i]='';closeSlotDialog();save();navigate('taste');if($('tasteWine'))$('tasteWine').value=id;toast('Flaske åpnet – rør '+(i+1)+' er nå tomt')}
function closeSlotDialog(){$('slotDialog').classList.add('hidden');editingSlot=null}
function saveSlotDialog(){
 if(editingSlot===null)return;
 const i=editingSlot,id=$('slotSelect').value;
 if(id){
   const w=db.wines.find(w=>w.id===id);
   if(!w)return toast('Vin finnes ikke');
   const placed=db.slots.filter((x,j)=>j!==i&&x===id).length;
   if(placed>=Number(w.qty))return toast('Ingen ledige flasker av denne vinen');
 }
 db.slots[i]=id;
 closeSlotDialog();save();toast(id?'Flaske plassert i rør '+(i+1):'Rør '+(i+1)+' tømt');
}

alle lokale data med sikkerhetskopien? Endringen vil også synkroniseres dersom skyen er aktiv.'))return;db={...structuredClone(initial),...data};save();toast('Sikkerhetskopi importert')}catch(e){toast('Kunne ikke lese sikkerhetskopien')}}

// Shelly: les fra Supabase. Selve innsamlingen må kjøres på serveren, ikke i Safari.
const shellyRanges = {day:86400000,week:7*86400000,month:30*86400000,year:365*86400000};
let shellyPeriod='day';
const shellyPanel=document.createElement('section');
shellyPanel.innerHTML='<div class="card"><h3>🌡 Temperatur og luftfuktighet</h3><div id="shelly-status" class="sub" aria-live="polite">Henter siste måling ...</div><div class="actions" id="shelly-periods"><button class="secondary" data-period="day">24 timer</button><button class="secondary" data-period="week">7 dager</button><button class="secondary" data-period="month">30 dager</button><button class="secondary" data-period="year">12 måneder</button></div><p class="sub" id="shelly-history-status">Velg periode for å vise historikk.</p><div id="shelly-chart"></div></div>';
document.querySelector('main').insertBefore(shellyPanel,document.getElementById('home'));
document.getElementById('shelly-periods').addEventListener('click',event=>{
  const period=event.target.closest('button[data-period]')?.dataset.period;
  if(period){hentShellyMaling();loadShellyHistory(period);}
});

function shellyGraph(values,unit,color){
  const valid=values.filter(v=>Number.isFinite(v));
  if(!valid.length)return '<p class="sub">Ingen registrerte verdier.</p>';
  const low=Math.min(...valid),high=Math.max(...valid),span=Math.max(high-low,1);
  const points=values.map((v,i)=>{
    const x=8+(i/Math.max(values.length-1,1))*304;
    const y=106-((v-low)/span)*88;
    return Number.isFinite(v)?x.toFixed(1)+','+y.toFixed(1):'';
  }).filter(Boolean).join(' ');
  const minText=low.toFixed(1),maxText=high.toFixed(1);
  return '<div class="small" style="margin:10px 0 4px">'+unit+': '+minText+'–'+maxText+'</div><svg viewBox="0 0 320 120" width="100%" role="img" aria-label="'+unit+' fra '+minText+' til '+maxText+'" style="background:#162720;border:1px solid #385044;border-radius:10px"><path d="M8 106H312" stroke="#536d59" stroke-width="1" fill="none"/><polyline points="'+points+'" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none"/></svg>';
}
async function hentShellyMaling(){
  const felt=document.getElementById('shelly-status');
  if(!felt)return;
  if(!cloud||!cloudUser){felt.textContent='Logg inn under Mer for å se Shelly-målinger';return;}
  const {data,error}=await cloud.from('shelly_measurements')
    .select('temperature,humidity,measured_at').order('measured_at',{ascending:false}).limit(1);
  if(error){felt.textContent='Kunne ikke lese måling: '+error.message;return;}
  if(!data?.length){felt.textContent='Ingen Shelly-målinger tilgjengelig';return;}
  const m=data[0],ts=new Date(m.measured_at),age=Date.now()-ts.getTime();
  const temp=Number(m.temperature),humid=Number(m.humidity);
  if(!Number.isFinite(temp)||!Number.isFinite(humid)){felt.textContent='Ugyldige sensordata';return;}
  const stale=Number.isFinite(age)&&age>2*60*60*1000?' · Obs: over 2 timer gammel':'';
  felt.innerHTML='<div class="two" style="margin:12px 0"><div><div class="sub">Siste temperatur</div><strong style="font-size:26px;color:#e5be78">'+temp.toFixed(1)+' °C</strong></div><div><div class="sub">Luftfuktighet</div><strong style="font-size:26px;color:#83b9d1">'+humid.toFixed(1)+' %</strong></div></div><div class="sub">Målt: '+safe(ts.toLocaleString('nb-NO'))+safe(stale)+'</div>';
}
async function loadShellyHistory(period){
  if(!shellyRanges[period])return;
  shellyPeriod=period;
  const status=document.getElementById('shelly-history-status'),chart=document.getElementById('shelly-chart');
  if(!cloud||!cloudUser){status.textContent='Logg inn under Mer for å se historikk.';return;}
  status.textContent='Henter historikk ...';chart.innerHTML='';
  document.querySelectorAll('#shelly-periods button').forEach(b=>{
    b.style.borderColor=b.dataset.period===period?'#e5be78':'#536d59';
  });
  const cutoff=new Date(Date.now()-shellyRanges[period]).toISOString();
  const rows=[];
  // Supabase returnerer ofte høyst 1000 rader per forespørsel. Hent flere sider ved behov.
  for(let offset=0;offset<11000;offset+=1000){
    const {data,error}=await cloud.from('shelly_measurements')
      .select('temperature,humidity,measured_at')
      .gte('measured_at',cutoff)
      .order('measured_at',{ascending:false})
      .range(offset,offset+999);
    if(error){status.textContent='Kunne ikke hente historikk: '+error.message;return;}
    if(!data?.length)break;
    rows.push(...data);
    if(data.length<1000)break;
  }
  const valid=rows.filter(m=>Number.isFinite(Number(m.temperature))&&Number.isFinite(Number(m.humidity))&&Number.isFinite(new Date(m.measured_at).getTime())).reverse();
  if(!valid.length){status.textContent='Ingen lagrede målinger i denne perioden.';return;}
  // Gjennomsnitt i tidsblokker gir lesbare kurver også over et helt år.
  const step=Math.max(1,Math.ceil(valid.length/250)),avg=[];
  for(let i=0;i<valid.length;i+=step){
    const slice=valid.slice(i,i+step);
    avg.push({temperature:slice.reduce((s,m)=>s+Number(m.temperature),0)/slice.length,
              humidity:slice.reduce((s,m)=>s+Number(m.humidity),0)/slice.length});
  }
  status.textContent=valid.length+' registrerte målinger · '+new Date(valid[0].measured_at).toLocaleDateString('nb-NO')+' – '+new Date(valid[valid.length-1].measured_at).toLocaleDateString('nb-NO');
  chart.innerHTML=shellyGraph(avg.map(m=>m.temperature),'Temperatur (°C)','#e5be78')
    +shellyGraph(avg.map(m=>m.humidity),'Luftfuktighet (%)','#83b9d1');
}
hentShellyMaling();
setInterval(()=>{if(cloudUser)hentShellyMaling();},60000);
