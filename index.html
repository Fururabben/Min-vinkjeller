<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16241f"><title>Min vinkjeller – Hytta</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e9eee9;background:#101a17}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#1b3029,#101a17 48%)}main{max-width:620px;margin:auto;padding:22px 17px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{color:#a6b6aa;font-size:11px;letter-spacing:2px;font-weight:700}h1{font-size:29px;margin:5px 0 0;letter-spacing:-.8px}h2{font-size:19px;margin:0 0 13px}h3{margin:0 0 8px;font-size:17px}.sub{color:#9baea1;font-size:13px}.card{background:#22342d;border:1px solid #385044;border-radius:19px;padding:17px;margin-bottom:15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat strong{display:block;font-size:32px;margin:3px 0}.gold{color:#e5be78}.muted{color:#a6b7ab}.wine{display:flex;gap:14px;align-items:center}.bottle{background:#34473d;border-radius:13px;display:grid;place-items:center;font-size:43px;width:73px;height:100px;flex-shrink:0}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#365944;color:#ccead4;font-size:11px;font-weight:700}.tabs{position:fixed;bottom:0;left:0;right:0;background:#192821;border-top:1px solid #385044;display:flex;justify-content:center;padding:9px 5px max(12px,env(safe-area-inset-bottom));z-index:3}.tab{border:0;background:none;color:#aab8ad;font-size:11px;flex:1;max-width:115px;padding:7px 1px}.tab b{display:block;font-size:21px;margin-bottom:3px}.tab.active{color:#e7c181}button{cursor:pointer}button.primary{background:#d8b573;color:#19251e;border:0;border-radius:12px;padding:13px 15px;font-weight:800;font-size:14px}button.secondary{background:#344a3d;color:#e6eee7;border:1px solid #536d59;border-radius:12px;padding:11px 13px;font-weight:650}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.section{margin:24px 0 11px;display:flex;justify-content:space-between;align-items:center}label{display:block;font-size:12px;color:#b7c8bb;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #4b6253;background:#14231d;color:#f0f4ef;border-radius:11px;padding:12px;font:inherit;font-size:15px}textarea{min-height:80px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.divider{border-top:1px solid #3a4d40;margin:14px 0}.item{padding:13px 0;border-bottom:1px solid #3a4d40}.item:last-child{border:0}.stars{color:#e5be78;letter-spacing:2px}.empty{padding:25px 15px;text-align:center;color:#aebfb2}.small{font-size:12px}.notice{background:#283d31;border-left:3px solid #e5be78;padding:12px;border-radius:8px;font-size:12px;color:#c5d5c9;margin:12px 0}.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.slot{aspect-ratio:1;background:#34483e;border:2px solid #536d59;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#dbe6dd;font-weight:700}.slot.filled{background:#684438;border-color:#b88a62}.slot small{font-size:10px;color:#d7c5b1}.progress{height:8px;background:#3a4a40;border-radius:10px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#d9b574}.badge{font-size:12px;background:#3b5143;border-radius:20px;padding:5px 10px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#e1c188;color:#19251e;padding:12px 18px;border-radius:12px;z-index:5;display:none;max-width:90%;text-align:center}.linkbtn{border:0;background:none;color:#e8c88d;padding:4px;font-weight:700}
 .dialogShade{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:10;padding:18px}.dialogBox{background:#22342d;border:1px solid #66806d;border-radius:18px;padding:20px;width:min(100%,430px);max-height:85vh;overflow:auto}.dialogBox h2{margin-bottom:12px}.dialogBox .actions{justify-content:flex-end}
</style></head><body><div id="toast" class="toast"></div><div id="slotDialog" class="dialogShade hidden" role="dialog" aria-modal="true"><div class="dialogBox"><h2 id="slotHeading">Velg vin</h2><p class="sub" id="slotInfo"></p><label for="slotSelect">Vin til røret</label><select id="slotSelect"></select><div class="actions" id="slotActions"><button class="secondary" onclick="closeSlotDialog()">Avbryt</button><button class="primary" onclick="saveSlotDialog()">Lagre plassering</button></div></div></div><main><header><div><div class="eyebrow">DIN PERSONLIGE VINSAMLING · V4.1</div><h1>Min vinkjeller <span class="gold">🍷</span></h1><div class="sub">Hytta · Et godt glass om gangen</div></div><span style="font-size:30px">🏡</span></header><section id="home"></section><section id="shelf" class="hidden"></section><section id="taste" class="hidden"></section><section id="likes" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs" id="tabs"></nav><script>
const KEY='min-vinkjeller-hytta-v1';const initial={wines:[{id:'ardanza2020',name:'Viña Ardanza Reserva',producer:'La Rioja Alta',year:'2020',region:'Rioja, Spania',qty:5,target:5,bought:'2026-10-22',price:'',notes:'',food:'Lam, storfe, sopp, modne oster',window:'Kan lagres videre; vurder utviklingen over tid.'}],likes:[],tastings:[],climate:[],slots:[],wishlist:['Matsu El Viejo 2023','Rivetto Barolo Serralunga 2016','Marchesi di Barolo Ruvei Barbera d’Alba 2023','Protos Roble 2024','Biscardo Neropasso 2023'],shelfCapacity:30};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)};let current='home';let editingSlot=null;const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function btn(text,fn,kind='secondary'){return `<button class="${kind}" onclick="${fn}">${text}</button>`}function navigate(page){current=page;render();window.scrollTo(0,0)}function render(){let names=[['home','⌂','Hjem'],['shelf','▦','Vinhylle'],['taste','★','Smaking'],['likes','♡','Liker-listen'],['settings','⚙','Mer']];$('tabs').innerHTML=names.map(([id,ico,name])=>`<button class="tab ${current===id?'active':''}" onclick="navigate('${id}')"><b>${ico}</b>${name}</button>`).join('');names.forEach(([id])=>$(id).classList.toggle('hidden',id!==current));const count=db.wines.reduce((a,w)=>a+Number(w.qty||0),0);const full=db.wines.filter(w=>w.qty>=w.target&&w.target>0).length;$('home').innerHTML=`<div class="stats"><div class="card stat"><span class="sub">Flasker på lager</span><strong>${count}</strong><span class="small gold">Mål: 30 + magnum</span></div><div class="card stat"><span class="sub">Komplette vintyper</span><strong>${full}<span class="muted">/6</span></strong><span class="small muted">Faste favoritter</span></div></div><div class="card"><div class="row"><h3>Samlingen vokser</h3><span class="badge">${Math.round(Math.min(100,count/30*100))}%</span></div><div class="progress"><div style="width:${Math.min(100,count/30*100)}%"></div></div><span class="sub">${count} av 30 planlagte standardflasker</span></div><div class="section"><h2>På lager nå</h2><button class="linkbtn" onclick="navigate('shelf')">Se alle →</button></div>${db.wines.filter(w=>w.qty>0).map(w=>`<div class="card wine"><div class="bottle">🍷</div><div><h3>${safe(w.name)}</h3><div class="sub">${safe(w.producer)} · ${safe(w.year)}</div><p><span class="pill">${w.qty} flasker</span></p><div class="sub">${safe(w.region)}</div></div></div>`).join('')||'<div class="empty">Ingen flasker registrert ennå.</div>'}<div class="section"><h2>Hva vil du gjøre?</h2></div><div class="actions">${btn('🍷 Åpne en flaske',"navigate('taste')",'primary')}${btn('♡ Registrer en favoritt',"navigate('likes')")}${btn('＋ Legg til vin',"navigate('shelf')")}</div><div class="notice">Data lagres kun i denne nettleseren. Ta sikkerhetskopi under «Mer» før du bytter telefon eller sletter nettleserdata.</div>`;
let positions=Array.from({length:Math.max(30,db.shelfCapacity||30)},(_,i)=>db.slots[i]||'');$('shelf').innerHTML=`<h2>Vinhylla</h2><p class="sub">Ett rør = én flaske. Velg et rør for å plassere eller fjerne én flaske. Beholdningen endres ikke ved plassering.</p><div class="card"><div class="shelf">${positions.map((id,i)=>`<button class="slot ${id?'filled':''}" onclick="assignSlot(${i})">${i+1}<small>${id?'🍷':''}</small></button>`).join('')}</div></div><p class="small muted">Plassert i rør: ${db.slots.filter(Boolean).length} av ${db.wines.reduce((a,w)=>a+Number(w.qty||0),0)} flasker. Flytting: tøm gammelt rør og velg nytt.</p><div class="section"><h2>Vinregister</h2>${btn('＋ Ny vin','addWine()','primary')}</div>${db.wines.map(w=>`<div class="card"><div class="row"><div><h3>${safe(w.name)} ${safe(w.year)}</h3><div class="sub">${safe(w.producer)} · ${safe(w.region)}</div></div><span class="pill">${w.qty}/${w.target}</span></div><p class="small muted">Mat: ${safe(w.food||'Ikke registrert')}</p><p class="small muted">${safe(w.window||'')}</p><div class="actions">${btn('＋ Kjøpt',`changeQty('${w.id}',1)`)}${btn('− Uttak',`openBottle('${w.id}')`)}${btn('Rediger',`editWine('${w.id}')`)}</div></div>`).join('')}`;
$('taste').innerHTML=`<h2>Smaksdagbok</h2><p class="sub">Registrer opplevelser og matfølge. Uttak fra lager føres når du åpner en flaske via «Vinhylle».</p><div class="card"><h3>Ny smaksregistrering</h3><label>Vin</label><select id="tasteWine"><option value="">Velg vin eller skriv navn nedenfor</option>${db.wines.map(w=>`<option value="${safe(w.id)}">${safe(w.name)} ${safe(w.year)}</option>`).join('')}</select><label>Annen vin (valgfritt)</label><input id="tasteOther" placeholder="Navn og årgang"><div class="two"><div><label>Karakter 1–5</label><select id="tasteRating">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)} (${n})</option>`).join('')}</select></div><div><label>Dato</label><input type="date" id="tasteDate" value="${today()}"></div></div><label>Matrett</label><input id="tasteFood" placeholder="Hva spiste du til?"><label>Hvor godt passet maten?</label><select id="tastePair"><option value="">Ikke vurdert</option><option>Perfekt</option><option>Bra</option><option>Middels</option><option>Passet ikke</option></select><label>Smaksnotater / feedback</label><textarea id="tasteNotes" placeholder="Duft, smak, syre, tanniner, helhetsinntrykk ..."></textarea><div class="actions">${btn('Lagre smaking','addTasting()','primary')}</div></div><div class="section"><h2>Tidligere smakinger</h2></div>${db.tastings.length?db.tastings.slice().reverse().map(t=>`<div class="card"><div class="row"><strong>${safe(t.name)}</strong><span class="stars">${'★'.repeat(Number(t.rating))}</span></div><div class="sub">${safe(t.date)} · ${safe(t.food||'Uten registrert mat')}</div><p>${safe(t.notes)}</p><span class="sub">Matmatch: ${safe(t.pair||'Ikke vurdert')}</span></div>`).join(''):'<div class="empty">Her kommer smaksopplevelsene dine.</div>'}`;
$('likes').innerHTML=`<h2>♡ Liker-listen</h2><p class="sub">Viner smakt hos venner, på restaurant eller andre steder. Påvirker ikke lagerbeholdningen.</p><div class="card"><h3>Legg til en vin du liker</h3><label>Vin / produsent</label><input id="likeName" placeholder="F.eks. Barolo Serralunga"><div class="two"><div><label>Årgang</label><input id="likeYear" placeholder="2021"></div><div><label>Karakter</label><select id="likeRating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} av 5</option>`).join('')}</select></div></div><label>Hvor smakte du den?</label><input id="likePlace" placeholder="Restaurant, venner, hjemme ..."><label>Mat og smaksnotater</label><textarea id="likeNotes" placeholder="Hva likte du? Hvilken mat passet?"></textarea><label>Kjøpe igjen?</label><select id="likeBuy"><option>Ja</option><option>Kanskje</option><option>Nei</option></select><label>Kandidat til fast plass i hylla?</label><select id="likeCandidate"><option value="yes">Ja</option><option value="no">Ikke nå</option></select><div class="actions">${btn('Lagre i Liker-listen','addLike()','primary')}</div></div><div class="section"><h2>Favoritter og utfordrere</h2></div>${db.likes.length?db.likes.slice().reverse().map(l=>`<div class="card"><div class="row"><h3>${safe(l.name)} ${safe(l.year)}</h3><span class="stars">${'★'.repeat(Number(l.rating))}</span></div><div class="sub">${safe(l.place||'Sted ikke oppgitt')}</div><p>${safe(l.notes||'')}</p><span class="pill">${l.candidate==='yes'?'Utfordrer til vinhylla':'Liker-listen'}</span><span class="sub"> · Kjøpe igjen: ${safe(l.buy)}</span><div class="actions">${btn('Legg til i vinregister',`promoteLike('${l.id}')`)}</div></div>`).join(''):'<div class="empty">Her bygger vi listen over fremtidige utfordrere til de seks faste vinene.</div>'}`;
$('settings').innerHTML=`<h2>Mer og sikkerhetskopi</h2><div class="card"><h3>Innkjøpsplan</h3><p class="sub">Omtrent én flaske per måned · maks 700 kr per flaske som utgangspunkt.</p>${db.wishlist.map((w,i)=>`<div class="item row"><span>${safe(w)}</span><button class="linkbtn" onclick="removeWish(${i})">Fjern</button></div>`).join('')}<label>Legg til ønsket vin</label><input id="wishName" placeholder="Vin og årgang"><div class="actions">${btn('Legg til','addWish()')}</div></div><div class="card"><h3>Temperatur og luftfuktighet</h3><p class="sub">Manuell logg nå. Shelly-integrasjon vurderes i senere versjon.</p><div class="two"><div><label>Temperatur °C</label><input type="number" step="0.1" id="temp" placeholder="15.3"></div><div><label>Fuktighet %</label><input type="number" step="0.1" id="humid" placeholder="56"></div></div><div class="actions">${btn('Lagre måling','addClimate()')}</div>${db.climate.slice(-5).reverse().map(c=>`<div class="item small">${safe(c.date)} · ${safe(c.temp)} °C · ${safe(c.humid)} %</div>`).join('')}</div><div class="card"><h3>Sikkerhetskopi</h3><p class="sub">Eksporter en JSON-fil til Filer/iCloud Drive. Importer den ved behov for å gjenopprette alle registreringer.</p><div class="actions">${btn('↓ Eksporter data','exportData()','primary')}${btn('↑ Importer data',"$('importFile').click()")}</div><input class="hidden" id="importFile" type="file" accept=".json,application/json" onchange="importData(this)"></div><div class="card"><h3>Nullstill testdata</h3><p class="sub">Sletter alle lokale registreringer, feilregistrerte viner, rørplasseringer og smaksnotater. Starter på nytt med 5 flasker Viña Ardanza Reserva 2020 kjøpt 22.10.2026 og 30 tomme rør.</p><div class="actions">${btn('Nullstill og start på nytt','resetTestData()')}</div></div><div class="notice">Versjon 4.1. Data lagres fortsatt lokalt på denne enheten, ikke i en nettskytjeneste. Ingen automatisk synkronisering, innlogging eller Shelly-tilkobling er aktivert.</div>`;
}
function resetTestData(){if(!confirm('Vil du slette ALLE lokale registreringer og starte med 5 flasker Viña Ardanza og tomme rør?'))return;if(!confirm('Bekreft nullstilling: dette kan ikke angres uten en sikkerhetskopi.'))return;db=structuredClone(initial);localStorage.setItem(KEY,JSON.stringify(db));navigate('home');toast('Nullstilt: 5 flasker, 30 tomme rør')}
function ask(message,defaultValue=''){let r=prompt(message,defaultValue);return r===null?null:r.trim()}function changeQty(id,delta){let w=db.wines.find(x=>x.id===id);if(!w)return;if(delta<0&&w.qty<1)return toast('Ingen flasker igjen');w.qty=Math.max(0,Number(w.qty)+delta);save();toast('Beholdning oppdatert')}function openBottle(id){
 const w=db.wines.find(x=>x.id===id);
 if(!w||Number(w.qty)<1)return toast('Ingen flasker på lager');
 const occupied=db.slots.map((x,i)=>x===id?i:-1).filter(i=>i>=0);
 if(occupied.length===0)return toast('Plasser flasken i et rør først, og åpne den derfra');
 if(occupied.length===1)return openBottleFromSlot(occupied[0]);
 const choices=occupied.map(i=>`<option value="${i}">Rør ${i+1}</option>`).join('');
 $('slotHeading').textContent='Velg rør for uttak';
 $('slotInfo').textContent=w.name+' '+w.year;
 $('slotSelect').innerHTML=choices;
 editingSlot=null;
 $('slotActions').innerHTML='<button class="secondary" onclick="closeSlotDialog()">Avbryt</button><button class="primary" onclick="openSelectedBottle()">Åpne flasken</button>';
 $('slotDialog').classList.remove('hidden');
}
function openSelectedBottle(){openBottleFromSlot(Number($('slotSelect').value))}
function openBottleFromSlot(i){
 const id=db.slots[i];const w=db.wines.find(x=>x.id===id);
 if(!w||Number(w.qty)<1)return toast('Ingen flaske tilgjengelig i røret');
 if(!confirm('Åpne '+w.name+' '+w.year+' fra rør '+(i+1)+'? Lageret reduseres med én flaske og røret tømmes.'))return;
 w.qty=Number(w.qty)-1;db.slots[i]='';
 closeSlotDialog();save();navigate('taste');$('tasteWine').value=id;
 toast('Flaske åpnet fra rør '+(i+1)+' – lager oppdatert');
}
function moveBottleFromSlot(i){
 const id=db.slots[i];if(!id)return;
 const empty=db.slots.map((x,j)=>!x?j:-1).filter(j=>j>=0);
 if(!empty.length)return toast('Ingen ledige rør');
 $('slotHeading').textContent='Flytt fra rør '+(i+1);
 $('slotInfo').textContent='Velg et ledig rør. Lagerbeholdningen endres ikke.';
 $('slotSelect').innerHTML=empty.map(j=>`<option value="${j}">Rør ${j+1}</option>`).join('');
 $('slotSelect').classList.remove('hidden');
 $('slotActions').innerHTML='<button class="secondary" onclick="closeSlotDialog()">Avbryt</button><button class="primary" onclick="confirmMoveSlot('+i+')">Flytt flasken</button>';
}
function confirmMoveSlot(from){
 const to=Number($('slotSelect').value);
 if(!Number.isInteger(to)||to===from||to<0||to>=Math.max(30,db.shelfCapacity||30)||db.slots[to])return toast('Velg et ledig rør');
 if(!db.slots[from])return toast('Opprinnelig rør er tomt');
 db.slots[to]=db.slots[from];db.slots[from]='';closeSlotDialog();save();toast('Flyttet til rør '+(to+1));
}
function addWine(){let name=ask('Vinens navn');if(!name)return;let year=ask('Årgang','2023');if(year===null)return;let qty=Number(ask('Antall flasker', '1'));if(!Number.isInteger(qty)||qty<0)return toast('Ugyldig antall');db.wines.push({id:'w'+Date.now(),name,year,qty,producer:'',region:'',target:5,bought:today(),price:'',food:'',window:'',notes:''});save()}function editWine(id){let w=db.wines.find(x=>x.id===id);if(!w)return;for(let [field,label] of [['name','Navn'],['producer','Produsent'],['year','Årgang'],['region','Region'],['bought','Kjøpsdato ÅÅÅÅ-MM-DD'],['price','Pris per flaske (kr)'],['food','Matanbefaling'],['window','Drikkevindu / lagring'],['notes','Notater']]){let v=ask(label,w[field]||'');if(v===null){save();return}w[field]=v}let target=ask('Mål antall flasker',String(w.target));if(target!==null&&Number.isInteger(Number(target))&&Number(target)>=0)w.target=Number(target);save()}function assignSlot(i){
 editingSlot=i;
 const currentId=db.slots[i]||'';
 $('slotHeading').textContent='Rør '+(i+1);
 if(currentId){
  const w=db.wines.find(x=>x.id===currentId);
  $('slotInfo').textContent=w?`${w.name} ${w.year} – én flaske i røret.`:'Registrert flaske i røret.';
  $('slotSelect').innerHTML='<option value="">Velg handling nedenfor</option>';
  $('slotSelect').classList.add('hidden');
  $('slotActions').innerHTML='<button class="secondary" onclick="closeSlotDialog()">Avbryt</button><button class="secondary" onclick="moveBottleFromSlot('+i+')">Flytt flasken</button><button class="primary" onclick="openBottleFromSlot('+i+')">🍷 Åpne flasken</button>';
 }else{
  $('slotInfo').textContent='Velg en vin du har på lager. Ett rør rommer én flaske.';
  const choices=['<option value="">— Tomt rør —</option>'];
  db.wines.forEach(w=>{
   const placed=db.slots.filter(id=>id===w.id).length;
   if(placed<Number(w.qty))choices.push(`<option value="${safe(w.id)}">${safe(w.name)} ${safe(w.year)} (${Number(w.qty)-placed} tilgjengelig)</option>`);
  });
  $('slotSelect').innerHTML=choices.join('');
  $('slotSelect').classList.remove('hidden');
  $('slotActions').innerHTML='<button class="secondary" onclick="closeSlotDialog()">Avbryt</button><button class="primary" onclick="saveSlotDialog()">Lagre plassering</button>';
 }
 $('slotDialog').classList.remove('hidden');
}
function closeSlotDialog(){$('slotDialog').classList.add('hidden');$('slotSelect').classList.remove('hidden');editingSlot=null}
function saveSlotDialog(){
 if(editingSlot===null)return;
 const i=editingSlot,id=$('slotSelect').value;
 if(db.slots[i])return toast('Røret er allerede opptatt');
 if(!id)return toast('Velg en vin');
 const w=db.wines.find(w=>w.id===id);
 if(!w)return toast('Vin finnes ikke');
 const placed=db.slots.filter(x=>x===id).length;
 if(placed>=Number(w.qty))return toast('Ingen ledige flasker av denne vinen');
 db.slots[i]=id;closeSlotDialog();save();toast('Flaske plassert i rør '+(i+1));
}
function addTasting(){let id=$('tasteWine').value;let other=$('tasteOther').value.trim();let w=db.wines.find(x=>x.id===id);let name=other||(w?`${w.name} ${w.year}`:'');if(!name)return toast('Velg eller skriv inn vin');db.tastings.push({id:'t'+Date.now(),name,rating:$('tasteRating').value,date:$('tasteDate').value,food:$('tasteFood').value,pair:$('tastePair').value,notes:$('tasteNotes').value});save();toast('Smaksnotat lagret')}function addLike(){let name=$('likeName').value.trim();if(!name)return toast('Skriv inn vinens navn');db.likes.push({id:'l'+Date.now(),name,year:$('likeYear').value,rating:$('likeRating').value,place:$('likePlace').value,notes:$('likeNotes').value,buy:$('likeBuy').value,candidate:$('likeCandidate').value});save();toast('Lagt til i Liker-listen')}function promoteLike(id){let l=db.likes.find(x=>x.id===id);if(!l)return;db.wines.push({id:'w'+Date.now(),name:l.name,year:l.year,producer:'',region:'',qty:0,target:5,bought:'',price:'',food:'',window:'',notes:l.notes});save();toast('Lagt til i vinregisteret uten lagerbeholdning')}function removeWish(i){db.wishlist.splice(i,1);save()}function addWish(){let s=$('wishName').value.trim();if(s){db.wishlist.push(s);save()}}function addClimate(){let t=Number($('temp').value),h=Number($('humid').value);if(!$('temp').value||!$('humid').value||t< -30||t>60||h<0||h>100)return toast('Kontroller målingene');db.climate.push({date:new Date().toLocaleString('no-NO'),temp:t,humid:h});save();toast('Måling lagret')}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='min-vinkjeller-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(el){let f=el.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.wines)||!Array.isArray(data.likes)||!Array.isArray(data.tastings))throw Error('Ugyldig fil');if(!confirm('Erstatte alle lokale data med sikkerhetskopien?'))return;db={...structuredClone(initial),...data};save();toast('Sikkerhetskopi importert')}catch(e){toast('Kunne ikke lese sikkerhetskopien')}}render();
</script></body></html>
